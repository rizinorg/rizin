name: mandoc manpage lint

on:
  pull_request:
    paths:
      - 'man/**'
  push:
    paths:
      - 'man/**'

jobs:
  mandoc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mandoc
        run: |
          sudo apt update
          sudo apt install -y mandoc

      - name: Lint all man pages
        run: |
          mandoc -T lint man/*.1 man/*.7
