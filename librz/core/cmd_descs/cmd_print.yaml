  - name: ps
    summary: Print string at the current offset.
    subcommands:
      - name: ps
        summary: Print the string at the current offset in the block.
        cname: print_string
        modes:
          - RZ_OUTPUT_MODE_STANDARD
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: encoding
            type: RZ_CMD_ARG_TYPE_CHOICES
            default_value: "settings"
            choices:
              - "settings"
              - "guess"
              - "ascii"
              - "utf8"
              - "utf16le"
              - "utf32le"
              - "utf16be"
              - "utf32be"
              - "ibm037"
              - "ibm290"
              - "ebcdices"
              - "ebcdicuk"
              - "ebcdicus"
          - name: delimiter
            type: RZ_CMD_ARG_TYPE_CHOICES
            default_value: "null"
            choices: ["null", "block", "unprintable"]
        details:
          - name: Value details
            entries:
              - text: "String length"
                comment: "The string length depends on the block size. You need to change \
