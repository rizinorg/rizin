---
name: cmd_print
commands:
  - name: p2
    summary: Print 8x8 2bpp tiles.
    cname: cmd_print_2bpp_tiles
    args:
      - name: n
        type: RZ_CMD_ARG_TYPE_RZNUM
        optional: true
  - name: p8
    summary: Print 8bit hexpair list of bytes.
    subcommands:
      - name: p8
        summary: Print 8bit hexpair list of bytes.
        cname: cmd_print_8bit_hexpair
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_STANDARD
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: n
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: p8f
        summary: Print 8bit hexpair list of bytes in function (linear).
        cname: cmd_print_8bit_hexpair_function
        args: []
  - name: pb
    summary: Print bitstream of <n> bits, skipping the first <skip> bits.
    cname: print_bitstream
    modes:
      - RZ_OUTPUT_MODE_STANDARD
    args:
      - name: n
        type: RZ_CMD_ARG_TYPE_RZNUM
      - name: skip
        type: RZ_CMD_ARG_TYPE_RZNUM
        default_value: 0
  - name: pB
    summary: Print bitstream of <n> bytes
    cname: print_byte_bitstream
    modes:
      - RZ_OUTPUT_MODE_STANDARD
    args:
      - name: n
        type: RZ_CMD_ARG_TYPE_RZNUM
  - name: pa
    summary: Print (dis)assembly of given hexpairs/assembly
    subcommands:
      - name: pa
        summary: Print hexpairs of the given assembly expression
        cname: hex_of_assembly
        modes:
          - RZ_OUTPUT_MODE_STANDARD
        args:
          - name: assembly
            type: RZ_CMD_ARG_TYPE_STRING
            optional: false
      - name: pae
        summary: Print ESIL expression of the given assembly expression
        cname: esil_of_assembly
        modes:
          - RZ_OUTPUT_MODE_STANDARD
        args:
          - name: assembly
            type: RZ_CMD_ARG_TYPE_STRING
            optional: false
      - name: pad
        summary: Print assembly expression from hexpairs (alias for pix)
        cname: assembly_of_hex
        modes:
          - RZ_OUTPUT_MODE_STANDARD
        args:
          - name: hexpair
            type: RZ_CMD_ARG_TYPE_STRING
            optional: false
      - name: pade
        summary: Print ESIL expression from hexpairs
        cname: esil_of_hex
        modes:
          - RZ_OUTPUT_MODE_STANDARD
        args:
          - name: hexpair
            type: RZ_CMD_ARG_TYPE_STRING
            optional: false
  - name: pc
    summary: Print bytes as code byte arrays.
    cname: cmd_print_byte_array
    details:
      - name: Useful modifiers
        entries:
          - text: "pch @e:cfg.bigendian=<true|false>"
            comment: "Change endianness for pch, pcw and pcd commands"
          - text: "pc @! <n>"
            comment: "Change the N of bytes (i.e. block size)."
      - name: Example of usages
        entries:
          - text: "pch @! 64 @e:cfg.bigendian=true"
            comment: "Generate a C 32 bits array in big endian format, using 64 bytes"
          - text: "pcp 1024"
            comment: "Generate a Python byte array of size 1024"
          - text: "pcj 10"
            comment: "Generate a JSON bytes array of size 10"
    subcommands:
      - name: pc
        summary: Generate a C/C++ byte array.
        cname: cmd_print_byte_array_c_cpp_bytes
        args:
          - name: len
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pch
        summary: Generate a C/C++ 16 bits array.
        cname: cmd_print_byte_array_c_cpp_half_word
        args: []
      - name: pcw
        summary: Generate a C/C++ 32 bits array.
        cname: cmd_print_byte_array_c_cpp_word
        args: []
      - name: pcd
        summary: Generate a C/C++ 64 bits array.
        cname: cmd_print_byte_array_c_cpp_double_word
        args: []
      - name: pca
        summary: Generate a byte array in GAS assembly.
        cname: cmd_print_byte_array_asm
        args:
          - name:  len
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pcA
        summary: Generate a byte array in GAS assembly with instructions in comments.
        cname: cmd_print_byte_array_with_inst
        args:
          - name:  len
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pcb
        summary: Generate a bash script with the byte array.
        cname: cmd_print_byte_array_bash
        args:
          - name:  len
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pcg
        summary: Generate a Golang byte array.
        cname: cmd_print_byte_array_golang
        args:
          - name: len
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pcJ
        summary: Generate a Java byte array.
        cname: cmd_print_byte_array_java
        args:
          - name: len
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pcj
        summary: Generate a JSON byte array.
        cname: cmd_print_byte_array_json
        args:
          - name: len
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pck
        summary: Generate a Kotlin byte array.
        cname: cmd_print_byte_array_kotlin
        args:
          - name: len
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pcn
        summary: Generate a NodeJS buffer.
        cname: cmd_print_byte_array_nodejs
        args:
          - name: len
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pco
        summary: Generate a Objective-C/C++ byte array.
        cname: cmd_print_byte_array_objc
        args:
          - name: len
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pcp
        summary: Generate a Python byte array.
        cname: cmd_print_byte_array_python
        args:
          - name: len
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pcr
        summary: Generate a Rust byte array.
        cname: cmd_print_byte_array_rust
        args:
          - name: len
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pcs
        summary: Generate a Swift byte array.
        cname: cmd_print_byte_array_swift
        args:
          - name: len
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pcy
        summary: Generate a Yara match pattern.
        cname: cmd_print_byte_array_yara
        args:
          - name: len
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pc*
        summary: Generate a rizin commands for writing the byte array.
        cname: cmd_print_byte_array_rizin
        args:
          - name: len
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
  - name: pD
    summary: Disassemble N bytes (can be negative)
    cname: cmd_disassembly_n_bytes
    type: RZ_CMD_DESC_TYPE_ARGV_STATE
    modes:
      - RZ_OUTPUT_MODE_STANDARD
      - RZ_OUTPUT_MODE_QUIET
      - RZ_OUTPUT_MODE_TABLE
      - RZ_OUTPUT_MODE_JSON
    args:
      - name: n_bytes
        type: RZ_CMD_ARG_TYPE_RZNUM
        optional: true
  - name: pC
    summary: Print disassembly in columns
    subcommands:
      - name: pCd
        summary: Print <len> lines of instructions disassembly in columns
        cname: print_columns_disassembly
        args:
          - name: len
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pCD
        summary: Print <len> lines of the debug registers and stack in columns
        cname: print_columns_debug
        args:
          - name: len
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pCa
        summary: Print <len> lines of annotated hexdump in columns
        cname: print_columns_hex_annotated
        args:
          - name: len
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pCA
        summary: Print <len> lines of op analysis color map in columns
        cname: print_columns_hex_op_colored
        args:
          - name: len
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pCx
        summary: Print <len> lines of hexdump in columns
        cname: print_columns_hex
        args:
          - name: len
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pCw
        summary: Print <len> lines of 4-byte integer hexdump in columns
        cname: print_columns_hex_words
        args:
          - name: len
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
  - name: pd
    summary: Print Disassembly
    cname: cmd_print_disassembly
    subcommands:
      - name: pd
        summary: Disassemble N instructions (can be negative)
        cname: cmd_disassembly_n_instructions
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_STANDARD
          - RZ_OUTPUT_MODE_QUIET # replaces pdi
          - RZ_OUTPUT_MODE_TABLE
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: n_instrs
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pda
        summary: Disassemble all possible opcodes (byte per byte)
        cname: cmd_disassembly_all_opcodes
        subcommands:
          - name: pda
            summary: Disassemble all possible opcodes (byte per byte)
            cname: cmd_disassembly_all_possible_opcodes
            type: RZ_CMD_DESC_TYPE_ARGV_STATE
            modes:
              - RZ_OUTPUT_MODE_STANDARD
              - RZ_OUTPUT_MODE_QUIET
              - RZ_OUTPUT_MODE_JSON
            args:
              - name: n_bytes
                type: RZ_CMD_ARG_TYPE_RZNUM
                optional: true
          - name: pda=
            summary: Disassemble all possible opcodes (treeview)
            cname: cmd_disassembly_all_possible_opcodes_treeview
            args:
              - name: n_bytes
                type: RZ_CMD_ARG_TYPE_RZNUM
                optional: true
      - name: pdb
        summary: Disassemble basic block
        cname: cmd_disasm_basic_block
        subcommands:
          - name: pdb
            summary: Disassemble basic block
            cname: cmd_disassembly_basic_block
            type: RZ_CMD_DESC_TYPE_ARGV_STATE
            modes:
              - RZ_OUTPUT_MODE_STANDARD
              - RZ_OUTPUT_MODE_JSON
            args: []
          - name: pdbJ
            summary: Disassemble basic block as json containing the printed text
            cname: cmd_disassembly_basic_block_as_text_json
            type: RZ_CMD_DESC_TYPE_ARGV_STATE
            modes:
              - RZ_OUTPUT_MODE_STANDARD
            args: []
      - name: pdC
        summary: Prints the comments found in N instructions
        cname: cmd_comments_in_n_instructions
        args:
          - name: n_instrs
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pde
        summary: Disassemble N instructions following execution flow from current PC
        cname: cmd_disassembly_n_instructions_with_flow
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_STANDARD
          - RZ_OUTPUT_MODE_JSON
          - RZ_OUTPUT_MODE_QUIET
          - RZ_OUTPUT_MODE_QUIETEST
        args:
          - name: n_instrs
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pdf
        summary: Disassemble a function
        cname: cmd_disasm_func
        subcommands:
          - name: pdf
            summary: Disassemble a function
            cname: cmd_disassembly_function
            type: RZ_CMD_DESC_TYPE_ARGV_STATE
            modes:
              - RZ_OUTPUT_MODE_STANDARD
              - RZ_OUTPUT_MODE_JSON
            args: []
          - name: pdfs
            summary: Disassemble a function and outputs the summary of it.
            cname: cmd_disassembly_function_summary
            args: []
      - name: pdJ
        summary: Disassemble N instructions as json containing the printed text
        cname: cmd_disassembly_n_instrs_as_text_json
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_STANDARD
        args:
          - name: n_instrs
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pdk
        summary: Disassemble all methods of a class
        cname: cmd_disassembly_all_methods_class
        args: []
      - name: pdl
        summary: Disassemble N instructions and prints its sizes
        cname: cmd_sizes_of_n_instructions
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_STANDARD
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: n_instrs
            type: RZ_CMD_ARG_TYPE_RZNUM
            optional: true
      - name: pdp
        summary: Disassemble instructions and follows pointers to read ropchains
        cname: cmd_disassemble_ropchain
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_STANDARD
          - RZ_OUTPUT_MODE_QUIET
          - RZ_OUTPUT_MODE_JSON
        args:
          - name: limit
            type: RZ_CMD_ARG_TYPE_NUM
            optional: true
      - name: pdr
        summary: Disassemble recursively across the function graph
        cname: cmd_disassemble_recursive
        subcommands:
          - name: pdr
            summary: Disassemble recursively across the function graph
            cname: cmd_disassemble_recursively
            type: RZ_CMD_DESC_TYPE_ARGV_STATE
            modes:
              - RZ_OUTPUT_MODE_STANDARD
              - RZ_OUTPUT_MODE_JSON
            args: []
          - name: pdr.
            summary: Disassemble recursively across the function graph (from current basic block)
            cname: cmd_disassemble_recursively_from_current_block
            type: RZ_CMD_DESC_TYPE_ARGV_STATE
            modes:
              - RZ_OUTPUT_MODE_STANDARD
              - RZ_OUTPUT_MODE_JSON
            args: []
      - name: pdR
        summary: Disassemble recursively the block size bytes without analyzing functions
        cname: cmd_disassemble_recursively_no_function
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_STANDARD
          - RZ_OUTPUT_MODE_QUIET
          - RZ_OUTPUT_MODE_JSON
        args: []
      - name: pds
        summary: Summarize N bytes or current block or a function (strings, calls, jumps, refs)
        cname: cmd_disassemble_summarize
        subcommands:
          - name: pds
            summary: Summarize N bytes
            cname: cmd_disassemble_summarize_n_bytes
            args:
              - name: n_bytes
                type: RZ_CMD_ARG_TYPE_RZNUM
                optional: true
          - name: pdsf
            summary: Summarize the current function
            cname: cmd_disassemble_summarize_function
            args: []
          - name: pdsb
            summary: Summarize current block
            cname: cmd_disassemble_summarize_block
            args: []
  - name: pf
    summary: Print formatted data
    subcommands:
      - name: pf
        summary: Show data using given format string
        cname: cmd_print_format
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_STANDARD
          - RZ_OUTPUT_MODE_JSON
          - RZ_OUTPUT_MODE_QUIET
        args:
          - name: format
            type: RZ_CMD_ARG_TYPE_STRING
      - name: pf-
        summary: Remove named format
        cname: cmd_print_format_delete
        args:
          - name: formatname
            type: RZ_CMD_ARG_TYPE_PF_FORMAT_NAME
      - name: pf-*
        summary: Remove all named formats
        cname: cmd_print_format_delete_all
        args: []
      - name: pfa
        summary: Apply format string at given address and define flags for each field
        cname: cmd_print_format_apply
        args:
          - name: format
            type: RZ_CMD_ARG_TYPE_PF_FORMAT_NAME
      - name: pfc
        summary: Show data using given format string with C syntax
        cname: cmd_print_format_c
        args:
          - name: format
            type: RZ_CMD_ARG_TYPE_PF_FORMAT_NAME
      - name: pfd
        summary: Show data using given format string as DOT
        cname: cmd_print_format_dot
        args:
          - name: format
            type: RZ_CMD_ARG_TYPE_PF_FORMAT_NAME
      - name: pf.
        summary: Show data using given named format
        cname: cmd_print_format_named_dot
        type: RZ_CMD_DESC_TYPE_ARGV_STATE
        modes:
          - RZ_OUTPUT_MODE_STANDARD
          - RZ_OUTPUT_MODE_JSON
          - RZ_OUTPUT_MODE_QUIET
        args:
          - name: formatname
            type: RZ_CMD_ARG_TYPE_PF_FORMAT_PATH
            optional: true
      - name: pfn
        summary: List named formats/Print named format string/Define a new named format
        cname: cmd_print_format_named
        args:
          - name: formatname
            type: RZ_CMD_ARG_TYPE_PF_FORMAT_NAME
            optional: true
          - name: formatstring
            type: RZ_CMD_ARG_TYPE_STRING
            optional: true
      - name: pfo
        summary: Load a Format Definition File (FDF)
        cname: cmd_print_format_file
        args:
          - name: file
            type: RZ_CMD_ARG_TYPE_PF_FDF_FILE
            optional: true
      - name: pfs
        summary: Print the size of format in bytes
        cname: cmd_print_format_size
        args:
          - name: format
            type: RZ_CMD_ARG_TYPE_PF_FORMAT_NAME
      - name: pfv
        summary: Print the value for named format
        cname: cmd_print_format_value
        args:
          - name: format
            type: RZ_CMD_ARG_TYPE_PF_FORMAT_NAME
      - name: pfw
        summary: Write data using given format string
        cname: cmd_print_format_write
        args:
          - name: format
            type: RZ_CMD_ARG_TYPE_PF_FORMAT_PATH
          - name: value
            type: RZ_CMD_ARG_TYPE_STRING
            optional: true
    details:
      - name: Sized integers (lowercase=LE UPPER=BE)
        entries:
          - text: "x1 / x2 / x4 / x8"
            comment: "hex unsigned, N bytes"
          - text: "d1 / d2 / d4 / d8"
            comment: "decimal signed, N bytes"
          - text: "u1 / u2 / u4 / u8"
            comment: "decimal unsigned, N bytes"
          - text: "o1 / o2 / o4 / o8"
            comment: "octal, N bytes"
          - text: "b1 / b2 / b4 / b8"
            comment: "binary, N bytes"
          - text: "n1 / n2 / n4 / n8"
            comment: >
              hex unsigned, N bytes; endian comes from the active pf
              parsing context (set by pf -e, by a parent V/B's e=...,
              or by the embedding caller), not from the spec's case;
              useful when the byte order isn't fixed in the format
              itself (file headers with an endian marker, embedded
              protocols, serialised records)
          - text: "f2 / f4 / f8"
            comment: "IEEE 754 float, 2/4/8 bytes (half/single/double)"
      - name: Special scalars
        entries:
          - text: "c"
            comment: "single byte rendered as character"
          - text: "p / p2 / p4 / p8"
            comment: "pointer: bare p uses ctx.bits (2/4/8 bytes); p2/p4/p8 force the width"
          - text: "Q"
            comment: "uint128_t (16 bytes, byte-sequential)"
          - text: "r"
            comment: "raw hex byte dump (count via [N])"
          - text: "U / L"
            comment: "ULEB128 / SLEB128 (variable length)"
      - name: Strings (encoding-aware)
        entries:
          - text: "z"
            comment: "inline NUL-terminated string"
          - text: "z(utf16le)"
            comment: "encoding override (utf8, utf16le, utf16be, utf32le, utf32be, ibm037, ebcdic_us, ...)"
          - text: "z[N]"
            comment: "length-prefixed string, N-byte prefix (1/2/4/8), length is in characters"
          - text: "z(utf16le)[2b]"
            comment: "length prefix in BYTES (MS BSTR style); suffix 'b' switches the unit"
          - text: "s"
            comment: "pointer to NUL-terminated string (dereferences via read_at)"
      - name: Timestamps (parameterised)
        entries:
          - text: "t(unix32) / T(unix32)"
            comment: "wire format inside the parens; case selects LE/BE"
          - text: "supported formats"
            comment: "unix32, unix64, unixms, unixus, unixns, filetime (alias ntfs), dos, hfs, oletime, webkit, cocoa"
      - name: Typed composites
        entries:
          - text: "E (enum_type)"
            comment: "4-byte enum, name resolved via typedb"
          - text: "B (bitfield_type)"
            comment: "4-byte bitfield, name resolved via typedb"
          - text: "B4(R=1,W=2,X=4)"
            comment: "inline bitfield with named flags (size = 1/2/4/8 byte BN)"
          - text: "? (struct_type)"
            comment: "nested struct, name resolved via typedb"
          - text: "0..."
            comment: "leading '0' marks the format as a union (all fields share offset 0)"
      - name: DSL extensions
        entries:
          - text: "@N"
            comment: "align cursor up to next N-byte boundary (no value, no name)"
          - text: ":N"
            comment: "read N bits (1..64) from packed bitstream; MSB-first by default"
          - text: ":N< / :N>"
            comment: "explicit bit order: < = LSB-first, > = MSB-first"
          - text: "G"
            comment: "16-byte GUID/UUID, mixed-endian (MS) layout by default"
          - text: "G(le) / G(be)"
            comment: >
              GUID layout: G(le) is LE on D1/D2/D3 (D4 stays raw,
              effectively the MS layout); G(be) is RFC 4122 BE
          - text: "V(t=u1,l=u2,d=table)"
            comment: >
              TLV record; t=tag, l=length, e=le/be, h=v/l/a (len
              covers value / len+value / tag+len+value), d=dispatch
              table
          - text: "v(N) / v(N,lsb) / v(N,msb)"
            comment: >
              bitvector: N individual bits (1..4096) exposed as
              separate 0/1 scalars; consumes ceil(N/8) bytes; bytes
              are always shown low-address to high; within each byte
              the default (msb) prints bit 7 first through bit 0,
              while lsb flips that to bit 0 first through bit 7
          - text: "[@field_name]T"
            comment: "array whose length comes from an earlier scalar field"
      - name: Skip / repeat / pointers
        entries:
          - text: "."
            comment: "skip 1 byte; [N]. skips N bytes"
          - text: "3..."
            comment: "leading integer repeats the whole format N times"
          - text: "{N}..."
            comment: "alternate repeat syntax"
          - text: "*T"
            comment: "field is a pointer to T (dereferenced via read_at)"
          - text: "[N]T"
            comment: "fixed-size array of N elements of T"
      - name: Examples
        entries:
          - text: "pf 'x4 d2 u8 z magic ver size name'"
            comment: "header with hex u32, signed s16, unsigned u64, NUL-terminated string"
          - text: "pf 'B4(R=1,W=2,X=4,KERN=0x100) perms'"
            comment: "inline bitfield with named flags"
          - text: "pf 'u1 [@count] x4 count items'"
            comment: "u8 count, then that many u32 hex values"
          - text: "pf 'z(utf16le)[2b] bstr'"
            comment: "BSTR-style: 2-byte length prefix counting bytes, UTF-16 LE body"
          - text: "pf ':1 :7 x4 flag rest tail'"
            comment: "bit-level: 1 bit then 7 bits, then 4 bytes"
          - text: "pf 'G(be) uuid'"
            comment: "RFC 4122 big-endian UUID"
          - text: "pf 'V(t=u1,l=u2,d=usb_desc) record'"
            comment: "TLV dispatched via the 'usb_desc' tag-to-format table"
          - text: "pf 't(filetime) created'"
            comment: "8-byte Windows FILETIME timestamp"
          - text: "pf '3 0x4d4 a b'"
            comment: "repeat 3 times, union with fields x4 and d4"
          - text: "pf '? (mytype) field'"
            comment: "nested struct of typedb format 'mytype'"
      - name: Notes
        entries:
          - text: "bit order"
            comment: ":N defaults to MSB-first (matches DWARF and most network protocols); use <N for LSB-first"
          - text: "endian via case"
            comment: "lowercase specifier = little-endian, UPPERCASE = big-endian"
          - text: "context endian"
            comment: "n1/n2/n4/n8 take the active pf parsing context's current endian setting, not the spec's case"
          - text: "skip vs alignment"
            comment: "'.' / '[N].' skip an exact number of bytes; '@N' pads to the next N-byte boundary"
          - text: "deprecation"
            comment: >
              bare-letter codes (b, C, d, f, F, i, o, q, t, T, w, x,
              X, Z) still parse with a one-time warning; use the
              sized or parenthesised forms in new code
          - text: "pf 'X2D4u8 bigWord beef qword'"
            comment: "BE u16, BE s32, LE u64 -- one of every endianness/sign combination"
          - text: "pfn foo 'rr (eax)reg1 (eip)reg2'"
            comment: "Create object foo referencing two registers"
          - text: "pf 't(unix32)t(unix32) troll plop'"
            comment: "Print two unix-epoch (32-bit) timestamps with labels 'troll' and 'plop'"
